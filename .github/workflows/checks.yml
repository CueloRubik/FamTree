name: FamTree desktop checks
on:
  push:
    branches: [Electron-Windows]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax, data and icons
        run: |
          node --check js/app.mjs
          node --check desktop/main.cjs
          node --check desktop/preload.cjs
          npm test
          npm run test:icons
      - name: Install Electron and browser test tooling
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test desktop interface in Chromium
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/famtree-server.log 2>&1 &
          for attempt in {1..20}; do curl -fsS http://127.0.0.1:8000/ >/dev/null && break; sleep 1; done
          node tests/browser.mjs
      - name: Test Electron document handling
        run: xvfb-run -a node tests/desktop.mjs
